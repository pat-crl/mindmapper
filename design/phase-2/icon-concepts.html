<style>
  #mind-mapper-icon-studies {
    color-scheme: light dark;
    --ink: light-dark(#20242b, #eef1f7);
    --quiet: light-dark(#565f6d, #aeb8c7);
    --well: light-dark(#f3f5f8, #262b33);
    --paper: light-dark(#fff, #1c2026);
    --rule: light-dark(#dfe4eb, #3c424d);
    --blue: light-dark(#285eb3, #a0bfff);
    color: var(--ink);
    background: var(--paper);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    container-type: inline-size;
  }

  #mind-mapper-icon-studies * { box-sizing: border-box; }
  #mind-mapper-icon-studies h2,
  #mind-mapper-icon-studies h3,
  #mind-mapper-icon-studies p,
  #mind-mapper-icon-studies figure { margin: 0; }
  #mind-mapper-icon-studies h2 { font-size: 17px; font-weight: 600; }
  #mind-mapper-icon-studies h3 { font-size: 14px; font-weight: 600; }
  #mind-mapper-icon-studies p { color: var(--quiet); font-size: 13px; }
  #mind-mapper-icon-studies .mm-icon-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  #mind-mapper-icon-studies figure {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 12px;
    display: grid;
    gap: 12px;
    padding: 12px;
  }
  #mind-mapper-icon-studies .mm-icon-stage {
    display: grid;
    place-items: center;
    padding: 16px 0;
    background: var(--well);
    border-radius: 8px;
    min-width: 0;
  }
  #mind-mapper-icon-studies figcaption {
    display: grid;
    gap: 3px;
    align-content: start;
  }
  #mind-mapper-icon-studies .mm-icon-scales {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    margin-top: 6px;
  }
  #mind-mapper-icon-studies .mm-icon-size {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 32px;
    color: var(--quiet);
    font-size: 11px;
  }
  #mind-mapper-icon-studies .mm-icon-size:first-child {
    margin-right: auto;
  }
  #mind-mapper-icon-studies .mm-icon-note {
    margin-top: 12px;
    color: var(--quiet);
  }
  #mind-mapper-icon-studies .mm-icon-note strong {
    color: var(--blue);
    font-weight: 600;
  }

  #mind-mapper-icon-studies .mm-icon {
    width: var(--icon-size, 128px);
    height: var(--icon-size, 128px);
    flex: none;
    display: block;
    position: relative;
    overflow: hidden;
    border-radius: 24%;
    background: linear-gradient(145deg, var(--tile-light), var(--tile-dark));
    box-shadow: inset 0 0 0 1px var(--rim);
  }
  #mind-mapper-icon-studies .mm-preview-32 { --icon-size: 32px; }
  #mind-mapper-icon-studies .mm-preview-16 { --icon-size: 16px; }
  #mind-mapper-icon-studies .mm-icon i { position: absolute; display: block; }
  #mind-mapper-icon-studies .mm-icon .wire { background: var(--wire); }
  #mind-mapper-icon-studies .mm-icon .node {
    background: var(--node);
    border-radius: 22%;
  }

  #mind-mapper-icon-studies .mm-branch {
    --tile-light: #fcfdff;
    --tile-dark: #cdd8e9;
    --rim: #8799b57a;
    --wire: #56739d;
    --node: #2858a2;
  }
  #mind-mapper-icon-studies .mm-branch .wire-a { left: 30%; top: 47%; width: 24%; height: 6%; }
  #mind-mapper-icon-studies .mm-branch .wire-b { left: 49%; top: 30%; width: 6%; height: 40%; }
  #mind-mapper-icon-studies .mm-branch .wire-c { left: 49%; top: 29%; width: 22%; height: 6%; }
  #mind-mapper-icon-studies .mm-branch .wire-d { left: 49%; top: 65%; width: 22%; height: 6%; }
  #mind-mapper-icon-studies .mm-branch .node-a { left: 17%; top: 37%; width: 25%; height: 26%; background: #1c3457; }
  #mind-mapper-icon-studies .mm-branch .node-b { left: 62%; top: 22%; width: 22%; height: 21%; }
  #mind-mapper-icon-studies .mm-branch .node-c { left: 62%; top: 57%; width: 22%; height: 21%; }

  #mind-mapper-icon-studies .mm-loop {
    --tile-light: #435475;
    --tile-dark: #202d43;
    --rim: #7b8aa98f;
    --wire: #a6bde5;
    --node: #dbe8ff;
  }
  #mind-mapper-icon-studies .mm-loop .wire-a {
    left: 23%;
    top: 28%;
    width: 54%;
    height: 42%;
    background: transparent;
    box-shadow: inset 0 0 0 calc(var(--icon-size, 128px) * .06) var(--wire);
    border-radius: 16%;
  }
  #mind-mapper-icon-studies .mm-loop .node-a { left: 15%; top: 22%; width: 24%; height: 22%; }
  #mind-mapper-icon-studies .mm-loop .node-b { left: 61%; top: 55%; width: 24%; height: 22%; }
  #mind-mapper-icon-studies .mm-loop .node-c { left: 44%; top: 61%; width: 13%; height: 13%; border-radius: 50%; }

  #mind-mapper-icon-studies .mm-route {
    --tile-light: #e7f1ff;
    --tile-dark: #adc7ed;
    --rim: #7296c289;
    --wire: #305990;
    --node: #244675;
  }
  #mind-mapper-icon-studies .mm-route .wire-a { left: 21%; top: 65%; width: 31%; height: 7%; }
  #mind-mapper-icon-studies .mm-route .wire-b { left: 46%; top: 31%; width: 7%; height: 41%; }
  #mind-mapper-icon-studies .mm-route .wire-c { left: 46%; top: 31%; width: 31%; height: 7%; }
  #mind-mapper-icon-studies .mm-route .node-a { left: 15%; top: 61%; width: 18%; height: 16%; }
  #mind-mapper-icon-studies .mm-route .node-b { left: 67%; top: 24%; width: 18%; height: 21%; border-radius: 0; clip-path: polygon(0 0, 100% 50%, 0 100%); }

  @container (max-width: 650px) {
    #mind-mapper-icon-studies .mm-icon-grid { grid-template-columns: 1fr; }
    #mind-mapper-icon-studies figure { grid-template-columns: minmax(140px, 0.9fr) minmax(0, 1fr); }
    #mind-mapper-icon-studies .mm-icon-scales { gap: 2px 8px; align-content: start; }
    #mind-mapper-icon-studies .mm-icon-size:first-child { flex-basis: 100%; }
  }
  @container (max-width: 360px) {
    #mind-mapper-icon-studies figure { grid-template-columns: 1fr; }
    #mind-mapper-icon-studies .mm-icon-size:first-child { flex-basis: auto; }
  }
</style>
<section id="mind-mapper-icon-studies" aria-labelledby="mind-mapper-icon-title">
  <h2 id="mind-mapper-icon-title">App icon studies</h2>
  <div class="mm-icon-grid">
    <figure>
      <div class="mm-icon-stage" aria-hidden="true">
        <span class="mm-icon mm-branch"><i class="wire wire-a"></i><i class="wire wire-b"></i><i class="wire wire-c"></i><i class="wire wire-d"></i><i class="node node-a"></i><i class="node node-b"></i><i class="node node-c"></i></span>
      </div>
      <figcaption>
        <h3>Branch</h3>
        <p>One idea splits into two.</p>
        <div class="mm-icon-scales" role="group" aria-label="Branch preview sizes">
          <span class="mm-icon-size">128 px</span>
          <span class="mm-icon-size"><span class="mm-icon mm-branch mm-preview-32" aria-hidden="true"><i class="wire wire-a"></i><i class="wire wire-b"></i><i class="wire wire-c"></i><i class="wire wire-d"></i><i class="node node-a"></i><i class="node node-b"></i><i class="node node-c"></i></span>32 px</span>
          <span class="mm-icon-size"><span class="mm-icon mm-branch mm-preview-16" aria-hidden="true"><i class="wire wire-a"></i><i class="wire wire-b"></i><i class="wire wire-c"></i><i class="wire wire-d"></i><i class="node node-a"></i><i class="node node-b"></i><i class="node node-c"></i></span>16 px</span>
        </div>
      </figcaption>
    </figure>
    <figure>
      <div class="mm-icon-stage" aria-hidden="true">
        <span class="mm-icon mm-loop"><i class="wire wire-a"></i><i class="node node-a"></i><i class="node node-b"></i><i class="node node-c"></i></span>
      </div>
      <figcaption>
        <h3>Loop</h3>
        <p>A flow returns to its start.</p>
        <div class="mm-icon-scales" role="group" aria-label="Loop preview sizes">
          <span class="mm-icon-size">128 px</span>
          <span class="mm-icon-size"><span class="mm-icon mm-loop mm-preview-32" aria-hidden="true"><i class="wire wire-a"></i><i class="node node-a"></i><i class="node node-b"></i><i class="node node-c"></i></span>32 px</span>
          <span class="mm-icon-size"><span class="mm-icon mm-loop mm-preview-16" aria-hidden="true"><i class="wire wire-a"></i><i class="node node-a"></i><i class="node node-b"></i><i class="node node-c"></i></span>16 px</span>
        </div>
      </figcaption>
    </figure>
    <figure>
      <div class="mm-icon-stage" aria-hidden="true">
        <span class="mm-icon mm-route"><i class="wire wire-a"></i><i class="wire wire-b"></i><i class="wire wire-c"></i><i class="node node-a"></i><i class="node node-b"></i></span>
      </div>
      <figcaption>
        <h3>Route</h3>
        <p>A signal follows a right-angle path.</p>
        <div class="mm-icon-scales" role="group" aria-label="Route preview sizes">
          <span class="mm-icon-size">128 px</span>
          <span class="mm-icon-size"><span class="mm-icon mm-route mm-preview-32" aria-hidden="true"><i class="wire wire-a"></i><i class="wire wire-b"></i><i class="wire wire-c"></i><i class="node node-a"></i><i class="node node-b"></i></span>32 px</span>
          <span class="mm-icon-size"><span class="mm-icon mm-route mm-preview-16" aria-hidden="true"><i class="wire wire-a"></i><i class="wire wire-b"></i><i class="wire wire-c"></i><i class="node node-a"></i><i class="node node-b"></i></span>16 px</span>
        </div>
      </figcaption>
    </figure>
  </div>
  <p class="mm-icon-note"><strong>Selected · Loop.</strong> Its closed path and offset blocks give Mind Mapper a distinct silhouette.</p>
</section>
