<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Mind Mapper Prototype</title>
  <link rel="stylesheet" href="workspace.css">
  <script defer src="../src/model.js"></script>
  <script defer src="board.js"></script>
  <script defer src="geometry.js"></script>
  <script defer src="export.js"></script>
  <script defer src="export-dialog.js"></script>
  <script defer src="arrangement.js"></script>
  <script defer src="workflows.js"></script>
  <script defer src="structure.js"></script>
  <script defer src="ink.js"></script>
  <script defer src="wire-controls.js"></script>
  <script defer src="workspace.js"></script>
</head>
<body>
  <header class="titlebar">
    <button type="button" data-command="boards" aria-pressed="true" aria-controls="library">Boards</button>
    <div class="document">
      <input id="board-title" aria-label="Board title" maxlength="120" disabled>
      <span id="status" role="status" aria-live="polite">Opening…</span>
    </div>
    <button type="button" data-command="undo" aria-label="Undo" disabled>↶</button>
    <button type="button" data-command="redo" aria-label="Redo" disabled>↷</button>
    <button type="button" data-command="find" aria-controls="find-panel" aria-expanded="false">Find</button>
    <button type="button" data-command="inspector" aria-pressed="false" aria-controls="inspector">Inspector</button>
    <button type="button" id="export-trigger" class="accent" popovertarget="export-menu">Export</button>
    <div id="export-menu" popover>
      <button type="button" data-command="exportFigure">Figure…</button>
      <button type="button" data-command="exportBoard">Editable board</button>
      <button type="button" data-command="exportLibrary">Editable library</button>
    </div>
  </header>
  <div class="workspace">
    <aside id="library" aria-label="Board library">
      <div class="panel-title"><h2>Boards</h2><button type="button" data-command="new" aria-label="New board">+</button></div>
      <input id="library-search" class="panel-search" type="search" placeholder="Find boards" aria-label="Find boards">
      <nav id="board-list" aria-label="Saved boards"></nav>
      <div class="library-actions">
        <button type="button" popovertarget="starters">Start from template</button>
        <div id="starters" class="popup" popover>
          <button type="button" data-starter="mindmap">Mind map</button>
          <button type="button" data-starter="flowchart">Flowchart</button>
          <button type="button" data-starter="signal">Signal flow</button>
        </div>
        <button type="button" data-command="renameBoard">Rename board</button>
        <button type="button" data-command="duplicateBoard">Duplicate board</button>
        <button type="button" data-command="previousBoard" disabled>Previous board</button>
        <button type="button" data-command="removeBoard">Delete board…</button>
        <button type="button" data-command="open">Import</button>
        <button type="button" data-command="example">Example board</button>
      </div>
    </aside>
    <main aria-label="Mind Mapper board">
      <div id="viewport" tabindex="0" aria-label="Canvas" data-tool="select">
        <div id="world">
          <svg id="diagram" aria-hidden="true"></svg>
          <div id="objects" aria-label="Board objects"></div>
          <svg id="stroke-preview" aria-hidden="true"></svg>
          <svg id="wire-preview" aria-hidden="true"></svg>
          <div id="marquee" hidden></div>
          <div id="guides" aria-hidden="true"></div>
          <div id="handles"></div>
          <div id="ports" aria-label="Connector ports"></div>
          <div id="wire-handles" aria-label="Selected connector handles"></div>
          <textarea id="object-editor" aria-label="Object text" maxlength="20000" spellcheck="true" hidden></textarea>
        </div>
      </div>
      <div id="empty" hidden>
        <h1>Blank board</h1><p>Start anywhere on the canvas.</p>
        <div><button type="button" class="accent" data-start="text">Add text</button>
          <button type="button" data-start="branch">Start a mind map</button></div>
      </div>
      <div class="tools floating" role="group" aria-label="Canvas tools">
        <button type="button" data-tool="select" aria-pressed="true" title="Select or move">Select</button>
        <button type="button" data-tool="text" aria-pressed="false" title="Place text">Text</button>
        <button type="button" data-tool="note" aria-pressed="false" title="Place a note">Note</button>
        <button type="button" data-tool="shape" aria-pressed="false" title="Place a block">Shape</button>
        <button type="button" class="tool-caret" popovertarget="shapes" aria-label="Shape options">▾</button>
        <div id="shapes" class="popup" popover>
          <button type="button" data-shape="rectangle">Rectangle</button>
          <button type="button" data-shape="rounded">Rounded box</button>
          <button type="button" data-shape="decision">Decision</button>
          <button type="button" data-shape="circle">Circle</button>
          <button type="button" data-shape="line">Line</button>
          <button type="button" data-shape="junction">Junction</button>
        </div>
        <button type="button" data-tool="group" aria-pressed="false" title="Place a frame">Frame</button>
        <button type="button" data-tool="branch" aria-pressed="false" title="Place a branch root">Branch</button>
        <button type="button" data-tool="link" aria-pressed="false" title="Select two objects to connect">Connect</button>
        <button type="button" data-tool="draw" aria-pressed="false" title="Draw a stroke">Draw</button>
        <button type="button" data-tool="erase" aria-pressed="false" title="Erase parts of strokes">Erase</button>
        <button type="button" popovertarget="edit-menu">Edit</button>
        <div id="edit-menu" class="popup" popover>
          <button type="button" data-command="cut">Cut</button>
          <button type="button" data-command="copy">Copy</button>
          <button type="button" data-command="paste">Paste</button>
          <button type="button" data-command="duplicate">Duplicate selection</button>
          <button type="button" data-command="outline">Paste outline…</button>
          <button type="button" data-command="copyMarkdown">Copy Markdown</button>
          <button type="button" data-command="copyRich">Copy rich text</button>
        </div>
      </div>
      <div id="branch-tools" class="floating" role="group" aria-label="Mind map branch actions" hidden>
        <button type="button" data-command="branchLeft" title="Add a child on the left">Left child</button>
        <button type="button" data-command="branchRight" title="Add a child on the right">Right child</button>
        <button type="button" data-command="branchSibling">Sibling</button>
        <button type="button" data-command="branchFold">Fold</button>
      </div>
      <div class="view floating" role="group" aria-label="Canvas view">
        <button type="button" data-command="zoomOut" aria-label="Zoom out">−</button>
        <output id="zoom">100%</output>
        <button type="button" data-command="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" data-command="fit" title="Fit whole board">Fit</button>
        <button type="button" data-command="fitSelection">Fit selection</button>
        <button type="button" data-command="centre" title="Centre on the canvas origin">Centre</button>
      </div>
      <div class="snaps floating" role="group" aria-label="Board grid and snapping">
        <button type="button" data-command="grid" aria-pressed="true" title="Show or hide grid">Grid</button>
        <button type="button" data-command="snapGrid" aria-pressed="false" title="Snap movement to grid">Snap grid</button>
        <button type="button" data-command="snapObjects" aria-pressed="true" title="Snap to nearby objects">Snap objects</button>
      </div>
      <div id="find-panel" class="floating" hidden role="region" aria-label="Find in board">
        <div class="find-heading">
          <input id="board-find" type="search" placeholder="Find on this board" aria-label="Find on this board">
          <button type="button" data-command="closeFind" aria-label="Close find">×</button>
        </div>
        <div id="find-results" aria-live="polite"></div>
      </div>
      <div id="notice" class="floating" hidden role="alert">
        <span id="notice-text"></span><button type="button" data-command="save" id="retry" hidden>Try again</button>
        <button type="button" data-command="dismiss" aria-label="Dismiss message">×</button>
      </div>
    </main>
    <aside id="inspector" aria-label="Selection inspector" hidden>
      <div class="panel-title"><h2>Inspector</h2></div>
      <div id="properties"></div>
    </aside>
  </div>
  <dialog id="export-dialog" aria-labelledby="export-heading">
    <form>
      <h2 id="export-heading">Export figure</h2>
      <div class="export-layout">
        <div class="export-preview" id="export-preview">
          <img id="export-image" alt="Preview of the exported figure" hidden>
          <p id="export-empty">Nothing to export in this area.</p>
        </div>
        <fieldset class="export-options" aria-label="Figure settings">
          <div class="export-field"><label for="export-scope">Area</label>
            <select id="export-scope" autofocus>
              <option value="board">Whole board</option>
              <option value="selection">Selection</option>
              <option value="frame">Named frame</option>
            </select>
          </div>
          <div class="export-field" id="export-frame-field" hidden><label for="export-frame">Frame</label> <select id="export-frame"></select></div>
          <div class="export-field"><label for="export-format">Format</label>
            <select id="export-format">
              <option value="svg">SVG</option>
              <option value="pdf">PDF</option>
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
            </select>
          </div>
          <div class="export-field"><label for="export-background">Background</label>
            <select id="export-background">
              <option value="transparent">Transparent</option>
              <option value="white">White</option>
              <option value="board">Canvas</option>
            </select>
          </div>
          <div class="export-field"><label for="export-padding">Padding (px)</label>
            <select id="export-padding">
              <option value="0">0</option>
              <option value="12">12</option>
              <option value="24" selected>24</option>
              <option value="48">48</option>
              <option value="96">96</option>
            </select>
          </div>
          <div class="export-field" id="export-scale-field" hidden><label for="export-scale">Scale</label>
            <select id="export-scale">
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="3">3×</option>
              <option value="4">4×</option>
            </select>
          </div>
          <label class="export-folds"><input type="checkbox" id="export-folds"> Include folded branches</label>
        </fieldset>
      </div>
      <p id="export-size" aria-live="polite"></p>
      <p id="export-status" role="status" hidden></p>
      <footer>
        <button type="button" id="export-close">Close</button>
        <button type="button" id="export-share" hidden>Share…</button>
        <button type="submit" id="export-save" class="accent">Save…</button>
      </footer>
    </form>
  </dialog>
  <dialog id="outline-dialog" aria-labelledby="outline-heading">
    <form method="dialog">
      <h2 id="outline-heading">Paste outline</h2>
      <label for="outline-text">Indented text</label>
      <textarea id="outline-text" rows="8" required spellcheck="false"></textarea>
      <footer><button type="submit" value="cancel" formnovalidate>Cancel</button><button type="submit" value="paste" class="accent">Add branches</button></footer>
    </form>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-heading">
    <form method="dialog">
      <h2 id="delete-heading">Delete board?</h2>
      <p id="delete-title"></p>
      <footer><button type="submit" value="cancel" autofocus>Cancel</button><button type="submit" value="delete" class="danger">Delete board</button></footer>
    </form>
  </dialog>
  <input type="file" id="import-file" accept=".json,.mindmap,application/json" hidden>
</body>
</html>
